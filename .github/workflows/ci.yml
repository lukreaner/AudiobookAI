name: Native CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  AUDIOBOOKAI_LIVE_PROVIDER_TESTS: "0"

jobs:
  native-test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
          - name: Windows x64
            os: windows-2022
          - name: macOS
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install pinned pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 11.18.0
          run_install: false

      - name: Install pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.0.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install build-time Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf

      - name: Resolve pinned Rust toolchain
        run: rustup show

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release scripts and unresolved sidecar schema
        run: |
          python -m compileall -q scripts/release
          python -m unittest discover -s scripts/release/tests
          python -m unittest scripts/security/test_check_no_secrets.py
          python scripts/security/check_no_secrets.py --current --history
          python scripts/release/validate_workflow.py
          python scripts/release/check_versions.py
          python scripts/release/sidecars.py manifest --allow-unresolved

      - name: Type-check and build embedded dashboard
        run: |
          pnpm --dir web typecheck
          pnpm --dir web test
          pnpm --dir web build

      - name: Check Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Lint Rust targets
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --all-features --locked

      - name: Test Rust workspace
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Compile native desktop host
        run: cargo build --package audiobookai-desktop --locked
